<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uber Clone Signup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen flex flex-col text-white">

  <!-- Navbar -->
  <nav class="bg-black p-4 shadow-md border-b border-gray-700 flex justify-between items-center px-6">
    <div class="text-xl font-semibold">Welcome to Uber Clone </div>
    <div class="space-x-4">
      <button onclick="showForm('passenger')" class="hover:text-blue-400">Passenger</button>
      <button onclick="showForm('driver')" class="hover:text-blue-400">Driver</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow flex items-center justify-center">
    <div class="bg-gray-900 p-8 rounded-2xl shadow-lg w-full max-w-sm mt-8">

      <!-- Passenger Form -->
      <form action = "/passenger" method = "POST" id="passenger-form" class="space-y-4">
        <h2 class="text-2xl font-bold mb-6 text-center">Passenger Signup</h2>
        <input name = "name" type="text" placeholder="Full Name" class="w-full bg-black text-white border border-gray-700 p-2 rounded-xl" required />
        <input name = "email" type="email" placeholder="Email" class="w-full bg-black text-white border border-gray-700 p-2 rounded-xl" required />
        <input name = "password" type="password" placeholder="Password" class="w-full bg-black text-white border border-gray-700 p-2 rounded-xl" required />
        <button type="submit" class="w-full bg-white text-black p-2 rounded-xl hover:bg-gray-300">Sign Up as Passenger</button>
      </form>

      <!-- Driver Form -->
      <form action = "/driver" method = "POST" id="driver-form" class="space-y-4 hidden">
        <h2 class="text-2xl font-bold mb-6 text-center">Driver Signup</h2>
        <input name = "name" type="text" placeholder="Full Name" class="w-full bg-black text-white border border-gray-700 p-2 rounded-xl" required />
        <input name = "email" type="email" placeholder="Email" class="w-full bg-black text-white border border-gray-700 p-2 rounded-xl" required />
        <input name = "password" type="password" placeholder="Password" class="w-full bg-black text-white border border-gray-700 p-2 rounded-xl" required />
        <input name = "vehicle number" type="text" placeholder="Vehicle Number" class="w-full bg-black text-white border border-gray-700 p-2 rounded-xl" required />
        <input name = "license number" type="text" placeholder="License Number" class="w-full bg-black text-white border border-gray-700 p-2 rounded-xl" required />
        <button type="submit" class="w-full bg-white text-black p-2 rounded-xl hover:bg-gray-300">Sign Up as Driver</button>
      </form>

      <p class="text-sm text-center mt-4">
        Already have an account?
        <a href="/login" class="text-blue-400 hover:underline">Login</a>
      </p>
    </div>
  </main>

  <script>
    function showForm(type) {
      document.getElementById("passenger-form").classList.toggle("hidden", type !== "passenger");
      document.getElementById("driver-form").classList.toggle("hidden", type !== "driver");
    }
  </script>

</body>
</html>
